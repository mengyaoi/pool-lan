name = "pool-lan"
main = "worker/index.mjs"
compatibility_date = "2026-11-01"

# 静态文件（public/index.html、js、css）由 ASSETS 直接返回，不产生函数调用
[assets]
directory = "./public"
binding = "ASSETS"

# 一房间一个 Durable Object：同一 roomId 必然落在同一实例，两人不会互相看不见
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# 绑定自定义域名（DNS 已在本账号的 Cloudflare 上，会自动建记录并签发证书）
[[routes]]
pattern = "pool-lan.wjp888.dpdns.org"
custom_domain = true
zone_name = "wjp888.dpdns.org"