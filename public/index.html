<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1511">
<title>双人台球 · 经典八球</title>
<link rel="stylesheet" href="style.css?v=20261106-20">
</head>
<body>
<div id="app">

  <header id="hud">
    <div class="pcard" id="card0">
      <div class="avatar">1</div>
      <div class="pmeta">
        <div class="pname" id="name0">玩家 1</div>
        <div class="ptask" id="task0"></div>
        <div class="pdots" id="dots0"></div>
      </div>
      <div class="pscore" id="score0">0</div>
    </div>

    <div id="center">
      <div id="status">正在连接…</div>
      <button id="roomBar" class="roombar" type="button" title="创建或加入房间">
        <span id="room">连接中…</span>
        <span class="roombar-cta">房间</span>
      </button>
    </div>

    <div class="pcard" id="card1">
      <div class="pscore" id="score1">0</div>
      <div class="pmeta right">
        <div class="pname" id="name1">玩家 2</div>
        <div class="ptask" id="task1"></div>
        <div class="pdots" id="dots1"></div>
      </div>
      <div class="avatar">2</div>
    </div>
  </header>

  <main id="stage">
    <canvas id="table"></canvas>
    <div id="toast"></div>
  </main>

  <section id="rotate" aria-labelledby="rotateTitle">
    <div class="rotate-card">
      <div class="rotate-icon" aria-hidden="true"><span class="phone"></span></div>
      <div class="rotate-copy">
        <h3 id="rotateTitle">横屏视野更宽，竖屏也能直接打</h3>
        <p>竖屏会把球桌转过来铺满屏幕，也能玩；横屏能同时放下球桌、力度条和杆法盘，视野更宽。</p>
      </div>
      <button id="btnRotateGo" class="primary">一键全屏横屏</button>
      <p class="rotate-tip" id="rotateTip">按钮没反应？请打开手机的「自动旋转」，再把手机横过来。</p>
      <button id="btnRotateSkip" class="linklike">直接用竖屏玩</button>
    </div>
  </section>

  <div id="dock">
    <div id="spinbox">
      <canvas id="spin-canvas" width="132" height="132"></canvas>
      <div class="spin-meta">
        <div class="spin-title">杆法</div>
        <div class="spin-hint" id="spinHint">中心</div>
      </div>
    </div>

    <div id="power">
      <div class="power-head">
        <span class="plabel">力量</span>
        <div id="aimNudge" aria-label="角度微调">
          <button id="btnAimL" type="button" title="角度左调">‹</button>
          <button id="btnAimR" type="button" title="角度右调">›</button>
        </div>
        <span class="power-label" id="powerLabel">0%</span>
      </div>
      <div class="power-track" id="powerTrack" role="slider" tabindex="0"
           aria-label="击球力度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="power-fill" id="powerFill"></div>
      </div>
      <div class="hint" id="hint">点球瞄准 · 按住台面向后拉，松手出杆</div>
    </div>

    <div class="btns">
      <button id="btnRoom" class="ghost">房间</button>
      <button id="btnLocal" class="ghost">本地双人</button>
      <button id="btnLandscape" class="ghost">横屏</button>
      <button id="btnPro" class="ghost">高手模式</button>
      <button id="btnSound" class="ghost">音效 开</button>
      <button id="btnRematch" class="primary">重新开局</button>
    </div>
  </div>

  <div id="overlay" class="hidden">
    <div class="panel">
      <h2 id="ovTitle">对局结束</h2>
      <div id="ovScore">0 : 0</div>
      <p id="ovDesc"></p>
      <button id="ovBtn" class="primary big">再来一局</button>
    </div>
  </div>

  <div id="roomModal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="rmTitle">
    <div class="panel roompanel">
      <h2 id="rmTitle">房间</h2>
      <p class="rm-desc">创建后把邀请链接发给对方，同一个房间号就能开一局。</p>

      <div class="rm-block">
        <label class="rm-label" for="rmCode">当前房间号</label>
        <div class="rm-row">
          <input id="rmCode" class="rm-input" type="text" maxlength="24" autocapitalize="off"
                 autocomplete="off" spellcheck="false" placeholder="例如 8f3k2a">
          <button id="rmCopy" class="ghost" type="button">复制链接</button>
        </div>
        <div class="rm-invite" id="rmInvite"></div>
      </div>

      <div class="rm-actions">
        <button id="rmCreate" class="primary" type="button">新建房间</button>
        <button id="rmJoin" class="ghost" type="button">加入上方房间</button>
      </div>
      <p class="rm-tip" id="rmTip">房间号只能有字母、数字、下划线或横线。</p>
      <button id="rmClose" class="linklike" type="button">关闭</button>
    </div>
  </div>

</div>
<script type="module" src="js/game.js?v=20261106-20"></script>
</body>
</html>
